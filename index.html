  /* ---------- display settings and reading place, kept in the account as well (some app views do not keep browser storage) ---------- */

      if(!d.t&&d.m) for(const k of Object.keys(rv)) rt[k]=d.m;          // older records: one time for all

        const r=rt[k]||0, l=first&&(k in rv)?0:(lt[k]||0);

        else if((k in lv)&&(!(k in rv)||l>r||JSON.stringify(lv[k])!==JSON.stringify(rv[k])&&l>=r)) push=true;

  const today=()=>dayNum();
  /* ---------- daily reading: a fixed pace of 3 dapim a day, counted in words (the tractate's average daf × 3),

  const wordsBetween=(a,b)=>{ let s=0; for(let i=a;i<b&&i<F.length;i++) s+=F[i].w; return s; };

    const from=ST.pos; if(from>=F.length) return null;
    const amt=planAmt(), keep=!dbBase||stSynced; let i=from, acc=0;
    while(i<F.length&&acc<amt){ acc+=F[i].w; i++; }

  /* ---------- bites ---------- */

    panel.append(h("p",{class:"note"},"פתיחת כל משנה, ובין המשניות הכותרות שכתבת"+(nT?" ("+nT+")":"")+". כותרת נכתבת בלחיצה על מילה, בסוג \"כותרת\"; דברי רקע בסוג \"רקע\"; סיכום של פסקה בלחיצה ארוכה על מילה. לחיצה על שורה מעבירה לשם."));
    const here=flatOf(current>=0?current:first,0)||0; let hereEl=null, ci=-1;
    const goTo=(a,u,g)=>{ closePanel(); layoutAt({a,u,w:g>0?gToTok(a,u,g):0}); };
    for(const e of ev){
      const p=perekOfFlat(e.f);
      if(p!==ci){ ci=p; body.append(h("div",{class:"mperek"},"פרק "+gem(p+1)+" · "+CHN[p])); }
      let el;
      if(e.k==="m"){ const {a,u}=F[e.f];
        el=h("button",{class:"mrow mi",onclick:()=>goTo(a,u,0)},h("span",{class:"r"},amudName(a)),h("span",{class:"t"},h("b",{},"מתני׳"),mishnaHead(e.sg))); }
      else if(e.k==="b") el=h("button",{class:"mrow ti",onclick:()=>goTo(e.a,e.u,e.g)},h("span",{class:"r"},amudName(e.a)),h("span",{class:"t"},e.x));
      else if(e.k==="s") el=h("div",{class:"msum",onclick:()=>goTo(e.a,e.u,0)},h("span",{class:"sl"},"סיכום · "+amudName(e.a)),e.x);
      else el=h("details",{class:"mbk"},h("summary",{},"רקע · "+amudName(e.a)),h("div",{class:"bx",onclick:()=>goTo(e.a,e.u,e.g)},e.x));
      if(e.f<=here) hereEl=el;
      body.append(el);
    }
    if(!ev.length) body.append(h("p",{class:"note"},"אין משניות במסכת."));
    panel.append(body);
    if(hereEl) setTimeout(()=>{ try{ hereEl.scrollIntoView({block:"center"}); }catch(e){} },30);
  }
  /* ---------- settings ---------- */
  $("setBtn").onclick=()=>{ loadExtraFonts(); Object.keys(FONTS).forEach(loadFaces); panelView="set"; renderSettings(); openPanel(); };
  const FONTS={
    frank:['"Frank Ruhl Libre"',null,"פרנק־ריהל","האות הקלאסית של ספרי הקודש המודפסים"],
    rubik:['"Rubik"',null,"רוביק","ללא תגים, עגול ורך"],
    heebo:['"Heebo"',null,"היבו","ללא תגים, נקי ודק"] };
  // fonts shipped as files are read and registered from their bytes (the page may not load font URLs itself)
  const faceP={};
  function loadFaces(k){ const f=FONTS[k]; if(!f||!f[4]||typeof f[4]!=="object") return Promise.resolve();
    if(faceP[k]) return faceP[k];
    const fam=f[0].replace(/"/g,"");
    return faceP[k]=Promise.all(Object.entries(f[4]).map(([w,url])=>fetch(url).then(r=>{ if(!r.ok) throw 0; return r.arrayBuffer(); })
      .then(buf=>new FontFace(fam,buf,{weight:String(w)}).load()).then(ff=>document.fonts.add(ff)))).catch(()=>{}); }
  const hasLight=k=>{ const f=FONTS[k]; return !!(f&&f[4]&&(f[4]===true?f[5]:f[4][300])); };
  let extraP=null;
  function loadExtraFonts(){ if(extraP) return extraP;
    extraP=new Promise(res=>{ const l=h("link",{rel:"stylesheet",href:"https://fonts.googleapis.com/css2?family=Rubik:wght@400;600;700&family=Heebo:wght@400;600;700&display=swap"});
      l.onload=res; l.onerror=res; setTimeout(res,4000); document.head.append(l); });
    return extraP; }
  let fontKey=lsGet("font","frank"); if(!FONTS[fontKey]&&fontKey!=="custom") fontKey="frank";
  const isExtra=k=>["rubik","heebo"].includes(k);
  function fontLoads(k){ if(isExtra(k)) return loadExtraFonts().then(()=>fontLoads2(k)); if(FONTS[k]&&FONTS[k][4]) return loadFaces(k).then(()=>fontLoads2(k)); return fontLoads2(k); }
  function fontLoads2(k){ const f=FONTS[k]||FONTS.frank; if(!document.fonts) return Promise.resolve();
    const L=[document.fonts.load("400 20px "+f[0]),document.fonts.load("700 20px "+f[0])]; if(f[1]) L.push(document.fonts.load("400 20px "+f[1])); return Promise.all(L).catch(()=>{}); }
  function setFont(k,relay){ const keep=!FONTS[k]&&k==="custom"; if(!FONTS[k]) k="frank"; fontKey=k; const [g,s]=FONTS[k], fb=',"Frank Ruhl Libre","Noto Serif Hebrew",Georgia,serif', r=document.documentElement.style;
    r.setProperty("--gfont",g+fb); r.setProperty("--sfont",(s||g)+fb); document.documentElement.classList.toggle("light-quotes",hasLight(k)); document.documentElement.classList.toggle("face-font",!!(FONTS[k]&&FONTS[k][4])); if(!keep) lsSet("font",k); if(relay) fontLoads(k).then(relayout); }
  function effSize(){ return compact?Math.max(11,Math.round(size*(innerWidth>=640?0.8:0.66))):size; }
  function applyType(){ const r=document.documentElement.style, lh=LH[lhi];
    r.setProperty("--size",effSize()+"px"); r.setProperty("--lh",String(compact?1.22:lh)); r.setProperty("--ugap",compact?".12em":(0.2+(lh-1.3)*0.75).toFixed(2)+"em"); }
  function setSize(v,relay){ size=Math.round(Math.max(10,Math.min(34,v))); applyType(); lsSet("px",size); if(relay) relayout(); }
  // "צפוף": a lot of text on one screen (smaller letters, tight lines, more columns, Gemara only) for review and titles
  function setCompact(on){ compact=on; $("cmpBtn").setAttribute("aria-pressed",String(on)); flow.classList.toggle("compact",on); lsSet("compact",on); applyType(); }
  $("cmpBtn").onclick=()=>keepPlace(()=>{ setCompact(!compact); });
  function setNiqqud(on,relay){ niqqud=on; lsSet("niqqud",on); if(relay) relayout(); }
  let showRefs=true;
  function setRefs(on,relay){ showRefs=on; flow.classList.toggle("norefs",!on); lsSet("refs",on); if(relay) relayout(); }
  let justify=false;
  function setJustify(on,relay){ justify=on; flow.classList.toggle("justify",on); lsSet("justify",on); if(relay) relayout(); }
  if(document.fullscreenEnabled||document.webkitFullscreenEnabled){
    const fb=$("fsBtn"); fb.hidden=false;
    fb.onclick=()=>{ const d=document, el=d.documentElement;
      if(d.fullscreenElement||d.webkitFullscreenElement){ (d.exitFullscreen||d.webkitExitFullscreen).call(d); return; }
      const rq=el.requestFullscreen||el.webkitRequestFullscreen; try{ const pr=rq&&rq.call(el); if(pr&&pr.catch) pr.catch(()=>{ fb.hidden=true; }); }catch(e){ fb.hidden=true; } };
    const fsSync=()=>fb.setAttribute("aria-pressed",String(!!(document.fullscreenElement||document.webkitFullscreenElement)));
    document.addEventListener("fullscreenchange",fsSync); document.addEventListener("webkitfullscreenchange",fsSync);
  }
  // line spacing in steps; the gap between units and between columns follows it
  const LH=[1.3,1.42,1.55,1.7,1.85,2.0]; let lhi=3;
  function setLine(i,relay){ lhi=Math.max(0,Math.min(LH.length-1,i)); const lh=LH[lhi]; dense=lh<1.5; applyType();
    lsSet("lh",lhi); if(relay) relayout(); }
  function setDense(on,relay){ setLine(on?1:3,relay); }
  function renderSettings(){
    panel.innerHTML="";
    panel.append(h("h2",{id:"panelTitle"},"הגדרות"));
    const sz=h("span",{style:"min-width:2.5em;text-align:center;font-variant-numeric:tabular-nums"},String(size));
    panel.append(h("div",{class:"block"},h("h3",{},"תצוגה"),
      h("div",{class:"row"},h("span",{},"גודל אותיות"),
        h("button",{class:"icon",onclick:()=>{ setSize(size-(size<=17?1:2),true); sz.textContent=size; }},"א־"),sz,
        h("button",{class:"icon",onclick:()=>{ setSize(size+(size<=16?1:2),true); sz.textContent=size; }},"א+")),
      (()=>{ const v=h("span",{style:"min-width:2.5em;text-align:center;font-variant-numeric:tabular-nums"},String(lhi+1));
        return h("div",{class:"row"},h("span",{},"ריווח שורות"),
          h("button",{class:"icon","aria-label":"ציפוף שורות",onclick:()=>{ setLine(lhi-1,true); v.textContent=lhi+1; }},"−"),v,
          h("button",{class:"icon","aria-label":"ריווח שורות",onclick:()=>{ setLine(lhi+1,true); v.textContent=lhi+1; }},"+")); })(),
      h("div",{class:"row"},h("button",{"aria-pressed":String(niqqud),onclick:e=>{ setNiqqud(!niqqud,true); e.currentTarget.setAttribute("aria-pressed",String(niqqud)); }},"ניקוד"),
        h("span",{class:"note"},"הניקוד נעשה אוטומטית ועלול לטעות; בלעדיו מוצג נוסח קורן כפי שהוא")),
      h("div",{class:"row"},h("button",{"aria-pressed":String(showRefs),onclick:e=>{ setRefs(!showRefs,true); e.currentTarget.setAttribute("aria-pressed",String(showRefs)); }},"מראי מקום"),
        h("span",{class:"note"},"מקור קטן אחרי כל ציטוט; לחיצה עליו פותחת את הפסוק")),
      h("div",{class:"row"},h("button",{"aria-pressed":String(rscript),onclick:e=>{ setRscript(!rscript,rashiOn); e.currentTarget.setAttribute("aria-pressed",String(rscript)); }},"כתב רש״י"),
        ...[1,2,3].map(i=>h("button",{class:"rwb","aria-pressed":String(rw===i),onclick:e=>{ setRw(i,rashiOn); e.currentTarget.parentNode.querySelectorAll(".rwb").forEach(b=>b.setAttribute("aria-pressed",String(b===e.currentTarget))); }},RW[i-1])),
        h("span",{class:"note"},"פירוש רש״י באותיות רש״י; כבוי: באותיות רגילות")),
      h("div",{class:"row"},h("button",{"aria-pressed":String(justify),onclick:e=>{ setJustify(!justify,true); e.currentTarget.setAttribute("aria-pressed",String(justify)); }},"יישור דו־צדדי"),
        h("span",{class:"note"},"שולי הטורים ישרים משני הצדדים")),
      h("h3",{},"גופן"),
      h("div",{class:"fonts",role:"radiogroup","aria-label":"גופן"},Object.entries(FONTS).map(([k,v])=>h("button",{class:"fopt",role:"radio","aria-checked":String(k===fontKey),
        onclick:e=>{ const me=e.currentTarget; setFont(k,true); panel.querySelectorAll(".fopt").forEach(b=>b.setAttribute("aria-checked",String(b===me))); }},
        h("span",{class:"fname"},v[2]),
        h("span",{class:"fsample",style:"font-family:"+v[0]+",serif"},"תָּנוּ רַבָּנַן: הַמּוֹצִיא מֵחֲנוּת לְפַלְטֵיָא דֶּרֶךְ סְטָיו — חַיָּיב"),
        v[1]?h("span",{class:"fsample st",style:"font-family:"+v[1]+",serif"},"הוצאה מרשות היחיד לרשות הרבים"):null,
        h("span",{class:"note"},v[3])))),
      ));
    panel.append(h("div",{class:"block"},h("h3",{},"תוכנית לימוד · מסכת "+TR.he),
      ST.plan?h("div",{},"3 דפים ביום · כ־"+fmtN(planAmt())+" מילים · היום: "+pctToday()+"%"+(streak()?" · רצף "+streak():"")):h("div",{class:"note"},"אין עדיין תוכנית"),
      h("div",{class:"row"},h("button",{"aria-pressed":String(askSum),onclick:e=>{ askSum=!askSum; lsSet("askSum",askSum); e.currentTarget.setAttribute("aria-pressed",String(askSum)); }},"\"מה למדת?\" אחרי ביס"),
        h("span",{class:"note"},"מה שתכתוב יוצג לך בתחילת הביס הבא")),
      h("div",{class:"row"},h("button",{class:"primary",onclick:()=>renderPlanForm()},ST.plan?"עריכת התוכנית":"יצירת תוכנית"))));
    if(window.BABLI_WEB&&window.BABLI_WEB.blocks) for(const b of window.BABLI_WEB.blocks()) panel.append(b);
    panel.append(transferBlock());
    panel.append(h("div",{class:"row"},h("button",{class:"ghost spacer",onclick:closePanel},"סגירה")));
    panel.append(h("p",{class:"note"},"נוסח מנוקד: מהדורת William Davidson בספריא (CC-BY-NC). ביאור: שטיינזלץ, מהדורת קורן (CC-BY-NC). רש״י: דפוס וילנא, דרך ספריא. חלוקת הסוגיות: לפי סימני הנקודתיים בדפוס וילנא."));
  }

  /* ---------- moving all data between versions of the app ---------- */
  function exportAll(){ const o={v:2,app:"babli-betur",t:{},p:{}};
    for(const t of TRACTS) o.t[t.key]={st:lsGet(t.ls+"st",null),notes:lsGet(t.ls+"notes",{}),nm:lsGet(t.ls+"notes-m",{})};
    for(const k of PREFK){ const x=lsGet(k,null); if(x!==null) o.p[k]=x; }
    for(const t of TRACTS){ const a=lsGet(t.ls+"amud",null); if(a!==null) o.p["amud:"+t.key]=a; }
    return JSON.stringify(o); }
  function importAll(txt){
    const o=JSON.parse(txt); if(!o||o.app!=="babli-betur"||!o.t) throw new Error("bad");
    const now=Date.now();
    for(const t of TRACTS){ const x=o.t[t.key]; if(!x) continue;
      const st=lsGet(t.ls+"st",null); if(x.st&&(!st||!st.plan||(x.st.pos||0)>=(st.pos||0))) lsSet(t.ls+"st",x.st);
      lsSet(t.ls+"notes",{...lsGet(t.ls+"notes",{}),...(x.notes||{})});
      const nm=lsGet(t.ls+"notes-m",{}); for(const k of Object.keys(x.nm||{})) nm[k]=now; lsSet(t.ls+"notes-m",nm); }
    // display settings, the plan's tractate, the mark, the place in each tractate
    for(const [k,x] of Object.entries(o.p||{})){
      if(k.startsWith("amud:")){ const t=TRACTS.find(t=>t.key===k.slice(5)); if(t) lsSet(t.ls+"amud",x); }
      else if(PREFK.includes(k)) lsSet(k,x); }
    { const t=lsGet("prefs-t",{}); for(const k of Object.keys(o.p||{})) t[k]=now; try{ localStorage.setItem(LS("prefs-t"),JSON.stringify(t)); }catch(e){} }
  }
  function transferBlock(){
    const out=h("div",{class:"block"},h("h3",{},"העברת נתונים"),
      h("p",{class:"note"},"מעתיק את התוכנית וההערות של כל המסכתות, כדי להדביק אותם בגרסה אחרת של האפליקציה. פתח קודם כל מסכת פעם אחת, כדי שהנתונים שלה יהיו מעודכנים."));
    const box=h("textarea",{id:"xfer",rows:"3",dir:"ltr",placeholder:"כאן מדביקים את הנתונים שהועתקו"}), msg=h("p",{class:"note"});
    out.append(h("div",{class:"row"},
      h("button",{onclick:()=>{ const s=exportAll(); box.value=s;
        const done=()=>{ msg.textContent="הנתונים הועתקו. הדבק אותם בגרסה החדשה, בהגדרות ← העברת נתונים."; };
        try{ navigator.clipboard.writeText(s).then(done,()=>{ box.select(); msg.textContent="סמן את הטקסט בתיבה והעתק אותו ידנית."; }); }catch(e){ box.select(); msg.textContent="סמן את הטקסט בתיבה והעתק אותו ידנית."; } }},"העתקת הנתונים"),
      h("button",{onclick:()=>{ try{ importAll(box.value.trim()); msg.textContent="הנתונים נטענו."; setTimeout(()=>location.replace(location.pathname),600); }catch(e){ msg.textContent="זה לא נראה כמו נתונים שהועתקו מהאפליקציה. העתק שוב ונסה."; } }},"טעינת נתונים שהודבקו")),
      box,msg);
    // or from a file (a phone handles a file more easily than a long pasted text)
    const fi=h("input",{type:"file",accept:".json,application/json,text/plain"});
    fi.onchange=async()=>{ const f=fi.files[0]; if(!f) return; try{ importAll((await f.text()).trim()); msg.textContent="הנתונים נטענו מהקובץ."; setTimeout(()=>location.replace(location.pathname),600); }catch(e){ msg.textContent="הקובץ לא נראה כמו נתונים של האפליקציה."; } };
    out.append(h("div",{class:"row"},h("span",{class:"note"},"או מקובץ:"),fi));
    return out;
  }

  /* ---------- start ---------- */
  setCompact(!!lsGet("compact",false)); setSize(lsGet("px",innerWidth<480?19:20)); { const li=lsGet("lh",null); if(li!=null) setLine(li); else setDense(!!lsGet("dense",false)); } setJustify(!!lsGet("justify",false)); setRefs(lsGet("refs",true)!==false); niqqud=lsGet("niqqud",true)!==false; setFont(fontKey);
  if(lsGet("stz",false)) setStz(true); else if(lsGet("rashi",false)) setRashi(true);
  setRscript(rscript);
  const SEDER={"Seder Zeraim":"סדר זרעים","Seder Moed":"סדר מועד","Seder Nashim":"סדר נשים","Seder Nezikin":"סדר נזיקין","Seder Kodashim":"סדר קדשים","Seder Tahorot":"סדר טהרות"};
  function fillTrSel(){
    const sel=$("trSel"); sel.innerHTML=""; let grp=null, last=null;
    for(const t of TRACTS){
      const o=h("option",{value:t.key,selected:t===TR||null},"מסכת "+t.he);
      if(t.seder&&t.seder!==last){ grp=h("optgroup",{label:SEDER[t.seder]||t.seder}); sel.append(grp); last=t.seder; }
      (grp||sel).append(o); }
  }
  async function loadTractList(){
    try{ const r=await fetch("tracts.json"); if(!r.ok) return; const list=await r.json();
      TRACTS=list.map(t=>({key:t.key,he:t.he,en:t.en,seder:t.seder,base:t.key+"/",db:t.key==="shabbat"?"talmud":"talmud-"+t.key,ls:t.key==="shabbat"?"":t.key+"-"}));
      TR=TRACTS.find(t=>t.key===TR.key)||TRACTS[0];
    }catch(e){}
  }
  async function loadTractate(key,amud){
    const t=TRACTS.find(x=>x.key===key)||TRACTS[0];
    if(A){ clearTimeout(saveT); try{ await flush(); }catch(e){} }
    TR=t; lsSet("tr",t.key); fillTrSel();
    A=null; Z=null; RZ=null; C=null; SG=null; dbBase=null; portion=null; BITE=null; flow.classList.remove("biteon"); current=-1; toks.clear();
    closePanel();
    flow.innerHTML='<div class="status">טוען את מסכת '+t.he+'…</div>';
    try{
      const [d,sg]=await Promise.all([
        fetch(t.base+"data.json").then(r=>{ if(!r.ok) throw 0; return r.json(); }),
        fetch(t.base+"sugyot.json").then(r=>{ if(!r.ok) throw 0; return r.json(); }),
        fetch(t.base+"refs.json").then(r=>r.ok?r.json():null).catch(()=>null).then(x=>{ REFS=x; }),
        fontLoads(fontKey), stzOn?loadStz():rashiOn?loadRashi():null, rashiOn&&rscript?rashiFace():null]);
      if(TR!==t) return;
      A=d.amudim; SG=sg; first=A.findIndex(x=>x&&x.length);
      buildModel(); loadLocal(); notePlanTr(); loadNotes(); BM=curBM();
      const opts=[]; for(let i=first;i<A.length;i++) if(A[i]) opts.push('<option value="'+i+'">'+short(i)+'</option>');
      $("dafSel").innerHTML=opts.join("");
      let s=amud; if(s==null){ const v=lsGetT("amud",null); if(v!=null) s=v; } if(s==null||!A[s]) s=first;
      layout(s); refreshBadge();
      storeP=initStore();
    }catch(e){ flow.innerHTML='<div class="status">לא הצלחתי לטעון את הטקסט. רענן את העמוד ונסה שוב.</div>'; }
  }
  $("trSel").onchange=e=>{ e.target.blur(); loadTractate(e.target.value,null); };
  window.addEventListener("hashchange",()=>{ const x=parseHashFull(); if(!x) return;
    if(x.tr!==TR.key) loadTractate(x.tr,x.a); });
  if(window.BABLI_WEB&&window.BABLI_WEB.init) window.BABLI_WEB.init({h,FONTS,setFont,fontKey:()=>fontKey,relayout,toast,
    reinit:()=>{ prefsDone=false; if(A) storeP=initStore(); }, openBite:()=>{ if(A) jumpToday(); },
    status:()=>({plan:!!(A&&ST.plan), pct:A&&ST.plan?pctToday():0, streak:A&&ST.plan?streak():0})});
  loadTractList().then(()=>{ const hx=parseHashFull(); loadTractate(hx?hx.tr:lsGet("tr","shabbat"),hx?hx.a:null); });
})();
